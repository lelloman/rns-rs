[package]
name = "rns-net"
description = "Network interfaces and node driver for the Reticulum Network Stack"
version = "0.12.0"
edition.workspace = true
license-file.workspace = true
publish = ["crates-io"]
repository.workspace = true
authors.workspace = true

[features]
default = ["iface-tcp", "iface-udp", "iface-local", "iface-auto", "iface-serial", "iface-kiss", "iface-ax25-kiss", "iface-pipe", "iface-rnode", "iface-backbone", "iface-i2p", "iface-weave"]
rns-hooks = ["rns-hooks-native"]
rns-hooks-wasm = ["hooks", "dep:rns-hooks-crate", "rns-hooks-crate/wasm", "dep:serde", "dep:postcard"]
rns-hooks-native = ["hooks", "dep:rns-hooks-crate", "rns-hooks-crate/native", "dep:serde", "dep:postcard"]
rns-hooks-builtin = ["hooks", "dep:rns-hooks-crate", "dep:serde", "dep:postcard"]
hooks = []
iface-tcp = []
iface-udp = []
iface-local = []
iface-auto = []
iface-serial = []
iface-kiss = []
iface-ax25-kiss = ["iface-kiss"]
iface-pipe = []
iface-rnode = []
iface-backbone = []
iface-i2p = []
iface-weave = []
# The parallel engine (docs/engines.md): without it, the compact engine.
engine-parallel = ["low-latency-flush", "proof-pool", "dep:rayon"]
# Compact engine: keep the timer and housekeeping threads instead of running
# that work on the driver loop.
compact-threads-timers = []
# Compact engine: keep the CPU-work threads (announce verification) instead
# of running that work on the driver loop.
compact-threads-work = []
# Compact engine: keep the service threads (RPC servers, provider bridge,
# probe server) instead of serving them on the driver loop.
compact-threads-services = []
# Compact engine: keep the interface reader and writer threads of the
# interface types that have a driver-loop form (UDP, so far).
compact-threads-io = []
# TCP interfaces write a buffered frame once it has waited 25 µs, instead of
# at the end of the driver's pass, unless `flush_after_us` says otherwise:
# more writes, less latency.
low-latency-flush = []
# `NodeConfig::link_proof_verify_threads` may start threads that verify link
# proofs off the driver thread; without it every proof is verified inline.
proof-pool = ["rns-crypto/ed25519-batch"]
# X25519 on aws-lc (rns-crypto's `x25519-aws-lc`): about twice as fast.
x25519-aws-lc = ["rns-crypto/x25519-aws-lc"]
# Ed25519 signing on aws-lc (rns-crypto's `ed25519-aws-lc`): about twice as
# fast; signatures are the same bytes (Ed25519 is deterministic).
ed25519-aws-lc = ["rns-crypto/ed25519-aws-lc"]

[dependencies]
zeroize = { version = "1", default-features = false, features = ["alloc"] }
rns-core.workspace = true
rns-hooks-crate = { package = "rns-hooks", version = "0.2.1", path = "../rns-hooks", optional = true, default-features = false }
rns-crypto.workspace = true
log = "0.4"
memchr = "=2.8.3"
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
rayon = { version = "1", optional = true }
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
polling = "3"
foldhash = "0.2"
bzip2 = { version = "0.6", default-features = false, features = ["bzip2-sys", "static"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"], optional = true }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
env_logger = "0.11"
serde_json = "1"
ctrlc = "3"
tempfile = "3"

[[bench]]
name = "link_dispatch"
harness = false

[[bench]]
name = "shared_client_replay"
harness = false

[[example]]
name = "tcp_connect"

[[example]]
name = "rnsd"

[[example]]
name = "rnode_lora"

[[example]]
name = "rnode_hil"

[[example]]
name = "weave_hil"
required-features = ["iface-weave"]
