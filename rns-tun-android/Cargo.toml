[package]
name = "rns-tun-android"
description = "Android JNI host boundary for rns-tun"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rns-tun = { workspace = true, features = ["android-node"] }
rns-crypto.workspace = true
rns-net = { version = "0.7.0", path = "../rns-net", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
jni = "0.21.1"
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
base64 = "0.22.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
zeroize = "1.8.2"
