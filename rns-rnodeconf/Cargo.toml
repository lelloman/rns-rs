[package]
name = "rns-rnodeconf"
description = "RNode configuration utility for the Reticulum Network Stack, compatible with upstream rnodeconf"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
publish = false
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rnodeconf"
path = "src/main.rs"

[dependencies]
rns-crypto = { workspace = true }
rns-net = { version = "0.12.0", path = "../rns-net", default-features = false }
libc = "0.2"
num-bigint = "0.4"
rsa = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
# Firmware release lookup and download, over rustls on the aws-lc provider
# the workspace already builds.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls = "0.23"
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
libc = "0.2"
tempfile = "3"
zip = { version = "9", default-features = false }
