name: RustSec audit

on:
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/.cargo/audit.toml"
      - ".github/workflows/rustsec.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/.cargo/audit.toml"
      - ".github/workflows/rustsec.yml"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.lockfile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lockfile: Cargo.lock
            working-directory: "."
          - lockfile: rns-esp32/Cargo.lock
            working-directory: rns-esp32

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # cargo audit directly: rustsec/audit-check failed its own check-run
      # update whenever it had a warning to report, which kept this red with
      # no vulnerability found. Informational advisories (unsound,
      # unmaintained) fail the gate too.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit dependencies
        working-directory: ${{ matrix.working-directory }}
        # rns-esp32's rust-toolchain.toml names the `esp` toolchain, which
        # is not installed here; auditing a lockfile needs no target.
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo audit --deny warnings
