name: RustSec audit

on:
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/rustsec.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/rustsec.yml"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  audit:
    name: Audit ${{ matrix.lockfile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lockfile: Cargo.lock
            working-directory: "."
          - lockfile: rns-esp32/Cargo.lock
            working-directory: rns-esp32

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ matrix.working-directory }}
