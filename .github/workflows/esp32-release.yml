name: ESP32 Firmware Release

on:
  push:
    tags:
      - 'rns-esp32-v*'

concurrency:
  group: esp32-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Pinned toolchain installers. When bumping a version, update the matching
  # checksum from the release page (GitHub shows a sha256 digest per asset).
  ESPUP_VERSION: v0.17.1
  ESPUP_SHA256: dbe54e9907b687809dbe1b955731569ed6df2b525362710d676256c5c8cf9ccd
  LDPROXY_VERSION: 0.3.5
  ESPFLASH_VERSION: 4.6.0

jobs:
  build:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#rns-esp32-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 python3-venv \
            libusb-1.0-0 pkg-config libudev-dev

      - name: Install espup and Espressif Rust toolchain
        run: |
          curl -fsSL "https://github.com/esp-rs/espup/releases/download/${ESPUP_VERSION}/espup-x86_64-unknown-linux-gnu" -o espup
          echo "${ESPUP_SHA256}  espup" | sha256sum --check --strict
          chmod +x espup
          ./espup install --targets esp32s3
          rm espup

      - name: Persist ESP environment
        run: cat "$HOME/export-esp.sh" >> "$GITHUB_ENV"

      - name: Install ldproxy and espflash
        run: |
          cargo install ldproxy --version "${LDPROXY_VERSION}" --locked
          cargo install espflash --version "${ESPFLASH_VERSION}" --locked

      - name: Cache ESP-IDF and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rns-esp32/.embuild
            rns-esp32/target
          key: esp32-build-${{ hashFiles('rns-esp32/Cargo.lock', 'rns-esp32/sdkconfig.defaults') }}
          restore-keys: esp32-build-

      - name: Build firmware
        working-directory: rns-esp32
        run: cargo build --locked --features firmware --target xtensa-esp32s3-espidf --release

      - name: Create flashable image and checksums
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir dist
          espflash save-image --chip esp32s3 --merge \
            rns-esp32/target/xtensa-esp32s3-espidf/release/rns-esp32 \
            "dist/${TAG}-esp32s3.bin"
          cd dist
          sha256sum -- *.bin > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: esp32-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ESP32 Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: esp32-release
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.bin
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "rns-esp32 ${{ needs.build.outputs.version }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.bin
            dist/SHA256SUMS
