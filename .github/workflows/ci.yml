name: CI

# The full suite runs on every push to master, nightly (against master, so a
# dependency, toolchain or upstream change that breaks it shows up without a
# commit) and on a manual run. On a pull request the `changes` job decides,
# from the files the pull request changes, which of the heavy jobs can be
# affected (scripts/ci_changes.py; rules in docs/development.md); the cheap
# checks always run. The slow analyses that do not gate changes, fuzzing,
# Miri, coverage and mutation testing, are in nightly.yml and fuzz.yml.
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "7 1 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A gated job tests `!= 'false'` rather than `== 'true'` and runs unless
# cancelled, so that if `changes` fails (empty outputs) every job still runs
# instead of being skipped, which would read as passing.
jobs:
  changes:
    name: Select Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      crates: ${{ steps.select.outputs.crates }}
      cargo_test: ${{ steps.select.outputs.cargo_test }}
      cargo_test_args: ${{ steps.select.outputs.cargo_test_args }}
      hook_examples: ${{ steps.select.outputs.hook_examples }}
      cli_features: ${{ steps.select.outputs.cli_features }}
      no_std: ${{ steps.select.outputs.no_std }}
      compact_engine: ${{ steps.select.outputs.compact_engine }}
      android: ${{ steps.select.outputs.android }}
      hooks: ${{ steps.select.outputs.hooks }}
      interop: ${{ steps.select.outputs.interop }}
      docker: ${{ steps.select.outputs.docker }}
      armv7: ${{ steps.select.outputs.armv7 }}
      ctl_tls: ${{ steps.select.outputs.ctl_tls }}
      esp32: ${{ steps.select.outputs.esp32 }}
      web_smoke: ${{ steps.select.outputs.web_smoke }}

    steps:
      # A pull_request run checks out the merge commit; its first parent is
      # the base branch, so the diff against it is what the pull request
      # changes.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Select jobs for the changed files
        id: select
        env:
          FULL_RUN: >-
            ${{ github.event_name != 'pull_request'
            || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$FULL_RUN" = "true" ]; then
            set -- --all
          else
            set -- --merge HEAD
          fi
          python scripts/ci_changes.py "$@" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  android-client:
    name: Android Client
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.android != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK and NDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # The wrapper downloads Gradle once and does not retry, so fetch it here
      # with retries before the build needs it.
      - name: Download Gradle
        working-directory: rns-tun-android
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle download attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Test and assemble Android client
        working-directory: rns-tun-android
        run: ./gradlew testDebugUnitTest assembleDebug

  python-tools:
    name: Python Tools
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile Python tools
        run: python -m compileall -q scripts tests

      - name: Run Python tool tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  upstream-badge:
    name: Upstream Badge
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check upstream badge matches UPSTREAM.md
        run: |
          # The sed pattern matches literal Markdown backticks.
          # shellcheck disable=SC2016
          upstream="$(sed -nE 's/^- Version: `([^`]+)`.*/\1/p' UPSTREAM.md | head -n1)"
          badge="$(sed -nE 's#.*img\.shields\.io/badge/upstream%20Reticulum-([^-)]*)-blue.*#\1#p' README.md | head -n1)"

          if [ -z "$upstream" ] || [ -z "$badge" ]; then
            echo "Could not find upstream version or README badge version"
            echo "UPSTREAM.md version: ${upstream:-missing}"
            echo "README.md badge:    ${badge:-missing}"
            exit 1
          fi

          if [ "$upstream" != "$badge" ]; then
            echo "README upstream badge is out of sync"
            echo "UPSTREAM.md version: $upstream"
            echo "README.md badge:    $badge"
            exit 1
          fi

  cargo-test:
    name: Cargo Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.cargo_test != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build hook WASM examples
        if: needs.changes.outputs.hook_examples != 'false'
        run: ./rns-hooks/build-examples.sh

      - name: Check CLI with selected interfaces
        if: needs.changes.outputs.cli_features != 'false'
        run: |
          cargo check -p rns-cli -p rns-ctl --bins --no-default-features
          cargo check -p rns-cli -p rns-ctl --bins --no-default-features --features iface-tcp,rns-hooks-native

      - name: Check core crates without std
        if: needs.changes.outputs.no_std != 'false'
        run: cargo check -p rns-crypto -p rns-core --no-default-features

      # Every workspace crate on a full run; on a pull request, the crates
      # the change reaches (those changed and every crate depending on them).
      - name: Run workspace tests
        env:
          CARGO_TEST_ARGS: ${{ needs.changes.outputs.cargo_test_args || '--workspace' }}
        run: |
          echo "cargo test $CARGO_TEST_ARGS"
          # shellcheck disable=SC2086 # one word per package argument
          cargo test $CARGO_TEST_ARGS
      - name: Install libdbus for the BLE RNode transport
        if: needs.changes.outputs.compact_engine != 'false'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Test the compact engine
        if: needs.changes.outputs.compact_engine != 'false'
        # The workspace build above runs the parallel engine (rns-cli asks for
        # it, and any test set with rns-net in it has rns-cli too); rns-net
        # built alone runs the compact one. Between them, every rns-net test,
        # the e2e suites included, runs under each I/O model: parallel,
        # compact folded and compact with its helper threads kept.
        run: |
          cargo test -p rns-net
          cargo test -p rns-net --features compact-threads-timers,compact-threads-work,compact-threads-services,compact-threads-io
          # The BLE RNode transport is not a default feature (it links libdbus).
          cargo test -p rns-net --lib --features iface-rnode-ble rnode

  esp32-lockfile:
    name: ESP32 Lockfile
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.esp32 != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0

      # Run from the repository root: rns-esp32/rust-toolchain.toml selects the
      # Espressif toolchain, which is not needed to resolve the lock file.
      - name: Check rns-esp32/Cargo.lock is up to date
        run: cargo metadata --locked --manifest-path rns-esp32/Cargo.toml --format-version 1 > /dev/null

  reticulum-interop:
    name: Reticulum ${{ matrix.reticulum.version }} Interop
    # Gated per step, not per job: a matrix job skipped as a whole reports
    # one unexpanded check instead of one per version.
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        reticulum:
          - version: 1.4.2
            commit: b48b96e61676504e0a4e527b33b9a0b4495c6872
            rns_tree: 3286dd665827d2e591b47efaa5706b643e9b8d5a
          - version: 1.5.4
            commit: 3f95b472820ddfb27f736143fb0b4d0d3aa610f1
            rns_tree: 51f0e922420b47f482df9184b48ade41ac8d6ce3
          - version: 1.5.5
            commit: 7f2b3b9b524c9386316379af1313b43a5e4f7a5d
            rns_tree: 192d74c76e5c56046a411492f219db1833c99365
          - version: 1.6.0
            commit: cb1260891d1b6da8f6e9b21542c4f0cc0725cac4
            rns_tree: 3448fb48deaf018bbe6e8a04795fa085bef2f2b9
          # Untagged 1.6.1 (the mirror's master at 884f109b); replace with
          # the release tag's commit once upstream signs one.
          - version: 1.6.1
            commit: 884f109b2b821638c7addd456a52a2cd5bb8c5b1
            rns_tree: 00ef77fcbaadad0ce252306c26bebaa301b77366

    steps:
      - name: Report a skipped run
        if: needs.changes.outputs.interop == 'false'
        run: echo "No change reaches the interop tests; skipping them."

      - name: Checkout rns-rs
        if: needs.changes.outputs.interop != 'false'
        uses: actions/checkout@v7

      - name: Checkout mirrored Reticulum interop target
        if: needs.changes.outputs.interop != 'false'
        run: |
          git clone https://github.com/markqvist/Reticulum.git reticulum-upstream
          git -C reticulum-upstream checkout "${{ matrix.reticulum.commit }}"
          test "$(git -C reticulum-upstream rev-parse HEAD)" = "${{ matrix.reticulum.commit }}"
          test "$(git -C reticulum-upstream rev-parse HEAD:RNS)" = "${{ matrix.reticulum.rns_tree }}"

      # Install what rust-toolchain.toml asks for up front; adding clippy to
      # the bare toolchain afterwards has failed on some runners with
      # "detected conflict: 'bin/cargo-clippy'".
      - name: Install Rust
        if: needs.changes.outputs.interop != 'false'
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      # Releases before 1.6.0 need LXMF's stamper for interface discovery.
      # The pinned RNS comes from PYTHONPATH, so LXMF is installed without
      # its RNS dependency.
      - name: Install LXMF
        if: needs.changes.outputs.interop != 'false'
        run: python3 -m pip install --user --no-deps lxmf==1.0.1

      # Upstream rnodeconf, which the rnodeconf comparison tests run.
      - name: Install rnodeconf dependencies
        if: needs.changes.outputs.interop != 'false'
        run: python3 -m pip install --user pyserial cryptography

      - name: Verify upstream version and run live interop
        if: needs.changes.outputs.interop != 'false'
        env:
          PYTHONPATH: ${{ github.workspace }}/reticulum-upstream
          RETICULUM_UPSTREAM_DIR: ${{ github.workspace }}/reticulum-upstream
        run: |
          python3 -c 'import RNS; assert RNS.__version__ == "${{ matrix.reticulum.version }}", RNS.__version__'
          # rns-net's interop under each I/O model (docs/engines.md): the
          # compact engine with every helper folded into the driver loop,
          # the compact engine with its helper threads kept, and the
          # parallel engine.
          cargo test -p rns-net --test python_interop -- --nocapture
          cargo test -p rns-net --features compact-threads-timers,compact-threads-work,compact-threads-services,compact-threads-io --test python_interop -- --nocapture
          cargo test -p rns-net --features engine-parallel --test python_interop -- --nocapture
          cargo test -p rns-cli --test utility_interop -- --ignored --nocapture
          cargo test -p rns-cli --test placeholders -- --ignored --nocapture
          cargo test -p rns-rnodeconf --test rnodeconf -- --ignored --nocapture
          # rns-git's Python-peer tests skip themselves without Python RNS,
          # so they only really run here.
          cargo test -p rns-git --lib -- --nocapture

  cargo-test-hooks:
    name: Cargo Test (rns-hooks)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.hooks != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build hook WASM examples
        run: ./rns-hooks/build-examples.sh

      - name: Run workspace tests with rns-hooks
        run: cargo test --workspace --features rns-hooks

      # rns-hooks builds no backend by default; test both, WASM included.
      - name: Run rns-hooks tests with both backends
        run: cargo test -p rns-hooks --features wasm,native

      # The workspace run above builds native hooks only, which leaves
      # e2e_hooks (WASM and built-in hooks) out; run it here under each I/O
      # model (docs/engines.md): compact folded, compact with its helper
      # threads kept, and parallel.
      - name: Run hook integration tests under each engine
        run: |
          cargo test -p rns-net --features rns-hooks-wasm,rns-hooks-builtin --test e2e_hooks
          cargo test -p rns-net --features rns-hooks-wasm,rns-hooks-builtin,compact-threads-timers,compact-threads-work,compact-threads-services,compact-threads-io --test e2e_hooks
          cargo test -p rns-net --features rns-hooks-wasm,rns-hooks-builtin,engine-parallel --test e2e_hooks

      - name: Run built-in hook rns-ctl test
        run: |
          cargo test -p rns-ctl --features rns-hooks-builtin test_hook_api_loads_reloads_lists_and_unloads_builtin_hook

  cargo-test-rns-ctl-tls:
    name: Cargo Test (rns-ctl tls)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ctl_tls != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run rns-ctl tests with tls
        run: cargo test -p rns-ctl --features tls

  armv7-build-smoke:
    name: ARMv7 Build Smoke
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.armv7 != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Install ARMv7 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build ARMv7 runtime binaries without hooks
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
        run: |
          cargo build --release --target armv7-unknown-linux-gnueabihf -p rns-cli --bin rnsd
          cargo build --release --target armv7-unknown-linux-gnueabihf -p rns-ctl

      - name: Build ARMv7 runtime binaries with native hooks
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
        run: |
          cargo build --release --target armv7-unknown-linux-gnueabihf -p rns-cli --bin rnsd --features rns-hooks-native
          cargo build --release --target armv7-unknown-linux-gnueabihf -p rns-ctl --features rns-hooks-native

      - name: Build ARMv7 rns-server with built-in hooks
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
        run: cargo build --release --target armv7-unknown-linux-gnueabihf --no-default-features -p rns-server --features rns-hooks-builtin

  rns-ctl-web-smoke:
    name: rns-ctl-web-smoke
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web_smoke != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run app smoke test
        run: node --test rns-ctl/assets/app.smoke.test.js

  docker-e2e:
    name: Docker E2E
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docker != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Docker end-to-end suite
        run: ./tests/docker/run-all.sh

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust with rustfmt
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Run rustfmt check
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust with Clippy
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install libdbus for the BLE RNode transport
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Run Clippy
        run: bash scripts/lint-host.sh
