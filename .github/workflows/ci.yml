name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-client:
    name: Android Client
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK and NDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test and assemble Android client
        working-directory: rns-tun-android
        run: ./gradlew testDebugUnitTest assembleDebug

  python-tools:
    name: Python Tools
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile Python tools
        run: python -m compileall -q scripts tests

      - name: Run Python tool tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  upstream-badge:
    name: Upstream Badge
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check upstream badge matches UPSTREAM.md
        run: |
          # The sed pattern matches literal Markdown backticks.
          # shellcheck disable=SC2016
          upstream="$(sed -nE 's/^- Version: `([^`]+)`.*/\1/p' UPSTREAM.md | head -n1)"
          badge="$(sed -nE 's#.*img\.shields\.io/badge/upstream%20Reticulum-([^-)]*)-blue.*#\1#p' README.md | head -n1)"

          if [ -z "$upstream" ] || [ -z "$badge" ]; then
            echo "Could not find upstream version or README badge version"
            echo "UPSTREAM.md version: ${upstream:-missing}"
            echo "README.md badge:    ${badge:-missing}"
            exit 1
          fi

          if [ "$upstream" != "$badge" ]; then
            echo "README upstream badge is out of sync"
            echo "UPSTREAM.md version: $upstream"
            echo "README.md badge:    $badge"
            exit 1
          fi

  cargo-test:
    name: Cargo Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build hook WASM examples
        run: ./rns-hooks/build-examples.sh

      - name: Run workspace tests
        run: cargo test --workspace

  reticulum-interop:
    name: Reticulum ${{ matrix.reticulum.version }} Interop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        reticulum:
          - version: 1.3.5
            commit: 50e03a24e8e10256363f6b73af7f6804ddb90e6f
            rns_tree: d49de3ba170d15ae2b6114ad3ea6053ab14300af
          - version: 1.4.2
            commit: b48b96e61676504e0a4e527b33b9a0b4495c6872
            rns_tree: 3286dd665827d2e591b47efaa5706b643e9b8d5a
          - version: 1.5.2
            commit: ea98db4f53dcf0defc0e71a16e60d28b1229c4e6
            rns_tree: 926167c7552b5bb538ff46cdd19b3ee2d16827b3

    steps:
      - name: Checkout rns-rs
        uses: actions/checkout@v7

      - name: Checkout mirrored Reticulum interop target
        run: |
          git clone https://github.com/markqvist/Reticulum.git reticulum-upstream
          git -C reticulum-upstream checkout "${{ matrix.reticulum.commit }}"
          test "$(git -C reticulum-upstream rev-parse HEAD)" = "${{ matrix.reticulum.commit }}"
          test "$(git -C reticulum-upstream rev-parse HEAD:RNS)" = "${{ matrix.reticulum.rns_tree }}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Verify upstream version and run live interop
        env:
          PYTHONPATH: ${{ github.workspace }}/reticulum-upstream
          RETICULUM_UPSTREAM_DIR: ${{ github.workspace }}/reticulum-upstream
        run: |
          python3 -c 'import RNS; assert RNS.__version__ == "${{ matrix.reticulum.version }}", RNS.__version__'
          cargo test -p rns-net --test python_interop -- --nocapture
          cargo test -p rns-cli --test utility_interop -- --ignored --nocapture

  cargo-test-hooks:
    name: Cargo Test (rns-hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build hook WASM examples
        run: ./rns-hooks/build-examples.sh

      - name: Run workspace tests with rns-hooks
        run: cargo test --workspace --features rns-hooks

      - name: Run built-in hook integration tests
        run: |
          cargo test -p rns-net --features rns-hooks-wasm,rns-hooks-builtin --test e2e_hooks builtin
          cargo test -p rns-ctl --features rns-hooks-builtin test_hook_api_loads_reloads_lists_and_unloads_builtin_hook

  cargo-test-rns-ctl-tls:
    name: Cargo Test (rns-ctl tls)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run rns-ctl tests with tls
        run: cargo test -p rns-ctl --features tls

  armv7-build-smoke:
    name: ARMv7 Build Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Install ARMv7 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build ARMv7 runtime binaries without hooks
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
        run: |
          cargo build --release --target armv7-unknown-linux-gnueabihf --no-default-features -p rns-cli --bin rnsd
          cargo build --release --target armv7-unknown-linux-gnueabihf --no-default-features -p rns-ctl

      - name: Build ARMv7 runtime binaries with native hooks
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
        run: |
          cargo build --release --target armv7-unknown-linux-gnueabihf --no-default-features -p rns-cli --bin rnsd --features rns-hooks-native
          cargo build --release --target armv7-unknown-linux-gnueabihf --no-default-features -p rns-ctl --features rns-hooks-native

      - name: Build ARMv7 rns-server with built-in hooks
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
        run: cargo build --release --target armv7-unknown-linux-gnueabihf --no-default-features -p rns-server --features rns-hooks-builtin

  rns-ctl-web-smoke:
    name: rns-ctl-web-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run app smoke test
        run: node --test rns-ctl/assets/app.smoke.test.js

  docker-e2e:
    name: Docker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Docker end-to-end suite
        run: ./tests/docker/run-all.sh

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust with rustfmt
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Run rustfmt check
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust with Clippy
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: bash scripts/lint-host.sh
