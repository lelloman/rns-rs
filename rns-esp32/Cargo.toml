[package]
name = "rns-esp32"
version = "0.1.0"
edition = "2021"
description = "Reticulum LoRa transport node firmware for Heltec WiFi LoRa 32 V3"

[features]
default = []
firmware = [
    "dep:embedded-graphics",
    "dep:esp-idf-hal",
    "dep:esp-idf-svc",
    "dep:esp-idf-sys",
    "dep:ssd1306",
    "rns-crypto/espidf",
]

[dependencies]
rns-core = { path = "../rns-core", default-features = false, features = ["std"] }
rns-crypto = { path = "../rns-crypto", default-features = false, features = ["std"] }

esp-idf-sys = { version = "0.38", optional = true }
esp-idf-svc = { version = "0.53", optional = true }
esp-idf-hal = { version = "0.47", optional = true }

log = "0.4"
ssd1306 = { version = "0.10", optional = true }
embedded-graphics = { version = "0.8", optional = true }

[[bin]]
name = "rns-esp32"
path = "src/main.rs"
required-features = ["firmware"]
test = false

# The workspace's lints (root Cargo.toml [workspace.lints]), copied: this
# crate is outside the workspace (it needs the ESP-IDF toolchain), so it
# cannot inherit them. Keep the two tables in step.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unreachable_pub = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
mem_forget = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[dev-dependencies]
rns-crypto = { path = "../rns-crypto", default-features = false, features = ["std", "test-rng"] }
embedded-graphics = "0.8"
embedded-hal = "1"
ssd1306 = "0.10"

# Crypto is unusably slow without optimization
[profile.dev.package.rns-crypto]
opt-level = 2

[profile.dev.package.curve25519-dalek]
opt-level = 2

[profile.dev.package.ed25519-dalek]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

# SSD1306 0.10 pins maybe-async-cfg 0.2.4, whose published artifact depends on
# the unmaintained proc-macro-error crate. Keep the compatible package version
# while using the reviewed local backport described in the vendor directory.
[patch.crates-io]
maybe-async-cfg = { path = "../vendor/maybe-async-cfg" }
