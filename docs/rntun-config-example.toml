version = 1
state_dir = "/var/lib/rntun/client"
node_config_dir = "/etc/rntun/reticulum"
underlay_mark = 21076 # 0x5254
status_socket = "/run/rntun/client.sock"

[client]
allowed_routes = ["10.20.0.0/16"]
requested_routes = ["10.20.0.0/16"]
allow_default_route = false
allowed_dns = []
tun_name = "rntun0"
tun_mtu = 1280
routing_table = 21076
physical_table = 254
underlay_rule_priority = 100
tunnel_rule_priority = 110

# A gateway uses the same top-level keys and this section instead:
# [gateway]
# address = "10.77.0.1/24"
