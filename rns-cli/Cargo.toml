[package]
name = "rns-cli"
description = "CLI tools for the Reticulum Network Stack"
version = "0.8.0"
edition.workspace = true
license-file.workspace = true
publish = ["crates-io"]
repository.workspace = true
authors.workspace = true

[features]
default = ["engine-parallel", "aws-lc", "iface-tcp", "iface-udp", "iface-auto", "iface-serial", "iface-kiss", "iface-ax25-kiss", "iface-pipe", "iface-rnode", "iface-backbone", "iface-i2p", "iface-weave"]
# The node's parallel engine (rns-net docs/engines.md); without it, compact.
engine-parallel = ["rns-net/engine-parallel"]
# X25519 and Ed25519 signing on aws-lc's assembly: about twice as fast
# (rns-net's `x25519-aws-lc` and `ed25519-aws-lc`). Needs a C compiler and
# CMake at build time; on targets other than x86_64 and aarch64 it is a no-op
# and the pure-Rust code is used.
aws-lc = ["rns-net/x25519-aws-lc", "rns-net/ed25519-aws-lc"]
iface-tcp = ["rns-net/iface-tcp"]
iface-udp = ["rns-net/iface-udp"]
iface-auto = ["rns-net/iface-auto"]
iface-serial = ["rns-net/iface-serial"]
iface-kiss = ["rns-net/iface-kiss"]
iface-ax25-kiss = ["rns-net/iface-ax25-kiss"]
iface-pipe = ["rns-net/iface-pipe"]
iface-rnode = ["rns-net/iface-rnode"]
iface-backbone = ["rns-net/iface-backbone"]
iface-i2p = ["rns-net/iface-i2p"]
iface-weave = ["rns-net/iface-weave"]
rns-hooks = ["rns-hooks-native"]
sidecars = [
    "dep:rns-hooks-abi",
    "dep:rns-stats-hook",
    "rns-stats-hook/builtin",
    "dep:rns-sentinel-hook",
    "rns-sentinel-hook/builtin",
]
rns-hooks-wasm = ["sidecars", "rns-net/rns-hooks-wasm"]
rns-hooks-native = [
    "sidecars",
    "rns-net/rns-hooks-native",
]
rns-hooks-builtin = ["sidecars", "rns-net/rns-hooks-builtin"]

[dependencies]
# CLI tools require shared-instance and remote-management APIs even in minimal builds.
rns-net = { version = "0.12.0", path = "../rns-net", default-features = false, features = ["iface-local"] }
rns-core.workspace = true
rns-crypto.workspace = true
rns-hooks-abi = { version = "0.2.0", path = "../rns-hooks/sdk/rns-hooks-abi", optional = true }
rns-stats-hook = { version = "0.2.0", path = "../rns-stats-hook", default-features = false, optional = true }
rns-sentinel-hook = { version = "0.2.0", path = "../rns-sentinel-hook", default-features = false, optional = true }
log = "0.4"
env_logger = "0.11"
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7"

[build-dependencies]
anyhow = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "rnsd"
path = "src/bin/rnsd.rs"

[[bin]]
name = "rnstatus"
path = "src/bin/rnstatus.rs"

[[bin]]
name = "rnpath"
path = "src/bin/rnpath.rs"

[[bin]]
name = "rnid"
path = "src/bin/rnid.rs"

[[bin]]
name = "rnprobe"
path = "src/bin/rnprobe.rs"

[[bin]]
name = "rnsh"
path = "src/bin/rnsh.rs"

[[bin]]
name = "rncp"
path = "src/bin/rncp.rs"

[[bin]]
name = "rnx"
path = "src/bin/rnx.rs"

[[bin]]
name = "rnir"
path = "src/bin/rnir.rs"

[[bin]]
name = "rnpkg"
path = "src/bin/rnpkg.rs"

[[bin]]
name = "rns-statsd"
path = "src/bin/rns-statsd.rs"
required-features = ["sidecars"]

[[bin]]
name = "rns-sentineld"
path = "src/bin/rns-sentineld.rs"
required-features = ["sidecars"]
