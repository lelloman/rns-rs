[package]
name = "rns-ctl"
description = "Reticulum Network Stack control tool"
version = "0.4.2"
edition.workspace = true
license-file.workspace = true
publish = ["crates-io"]
repository.workspace = true
authors.workspace = true

[features]
default = []
tls = ["rustls"]
rns-hooks = ["rns-hooks-native"]
rns-hooks-wasm = ["rns-net/rns-hooks-wasm"]
rns-hooks-native = ["rns-net/rns-hooks-native"]
rns-hooks-builtin = ["rns-net/rns-hooks-builtin"]

[dependencies]
rns-cli = { path = "../rns-cli", version = "0.4.2" }
rns-net.workspace = true
rns-core.workspace = true
rns-crypto.workspace = true
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
rustls = { version = "0.23", optional = true }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rns-hooks-crate = { package = "rns-hooks", version = "0.1.10", path = "../rns-hooks", default-features = false }
rustls = "0.23"
