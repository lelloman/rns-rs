name: rntun-e2e

networks:
  underlay:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.31.76.0/24
        - subnet: fd76:1::/64
  internet:
    driver: bridge
    ipam:
      config:
        - subnet: 198.18.0.0/24

services:
  client:
    image: rns-test
    container_name: rntun-client
    command: ["sleep", "infinity"]
    cap_add: ["NET_ADMIN"]
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/client:/etc/rntun:ro
      - ./resolvectl:/usr/local/bin/resolvectl:ro
    networks:
      underlay:
        ipv4_address: 172.31.76.2
        ipv6_address: fd76:1::2
    healthcheck:
      test: ["CMD", "test", "-c", "/dev/net/tun"]
      interval: 1s
      timeout: 1s
      retries: 20

  gateway:
    image: rns-test
    container_name: rntun-gateway
    command: ["sleep", "infinity"]
    cap_add: ["NET_ADMIN"]
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/gateway:/etc/rntun:ro
    networks:
      underlay:
        ipv4_address: 172.31.76.3
        ipv6_address: fd76:1::3
      internet:
        ipv4_address: 198.18.0.2
    sysctls:
      net.ipv4.ip_forward: "1"
    healthcheck:
      test: ["CMD", "test", "-c", "/dev/net/tun"]
      interval: 1s
      timeout: 1s
      retries: 20

  target:
    image: rns-test
    container_name: rntun-target
    command:
      - sh
      - -c
      - |
        ip address add 198.18.0.53/24 dev eth0
        exec socat -v UDP4-RECVFROM:53,reuseaddr,fork EXEC:/bin/cat
    cap_add: ["NET_ADMIN"]
    networks:
      internet:
        ipv4_address: 198.18.0.10
    healthcheck:
      test: ["CMD", "ip", "address", "show", "dev", "eth0"]
      interval: 1s
      timeout: 1s
      retries: 20
