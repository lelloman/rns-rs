[package]
name = "rns-core"
description = "Wire protocol, transport routing, and link/resource engine for the Reticulum Network Stack"
version = "0.5.0"
edition.workspace = true
license-file.workspace = true
publish = ["crates-io"]
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = ["rns-crypto/std"]

[dependencies]
rns-crypto = { version = "0.2.0", path = "../rns-crypto", default-features = false }
log = "0.4"
libm = "0.2"
hashbrown = { version = "0.17", default-features = false }
foldhash = { version = "0.2", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1"

[[bench]]
name = "transport_hot_paths"
harness = false
