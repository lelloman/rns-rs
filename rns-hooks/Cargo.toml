[package]
name = "rns-hooks"
description = "Programmable hook system for the Reticulum Network Stack"
version = "0.3.0"
edition.workspace = true
license-file.workspace = true
publish = ["crates-io"]
repository.workspace = true
authors.workspace = true

[features]
# No backend by default: WASM hooks compile in Wasmtime, a large dependency,
# so a build asks for the backend it needs (`wasm` or `native`).
default = []
wasm = ["dep:wasmtime"]
native = ["dep:libloading"]

[dependencies]
wasmtime = { version = "48", optional = true, default-features = false, features = ["cranelift", "runtime", "std", "gc", "gc-null", "parallel-compilation", "wat"] }
libloading = { version = "0.9", optional = true }
log = "0.4"
rns-hooks-abi = { version = "0.2.0", path = "sdk/rns-hooks-abi" }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
wat = "1"

[[test]]
name = "integration"
required-features = ["wasm"]

[[bench]]
name = "hook_dispatch"
harness = false
required-features = ["wasm"]
