[package]
name = "rns-crypto"
description = "Cryptographic primitives for the Reticulum Network Stack"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish = ["crates-io"]
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = []
espidf = ["esp-idf-sys"]

[dependencies]
esp-idf-sys = { version = "0.37", optional = true }
# `fast` / `precomputed-tables` keep the basepoint tables, so signing and
# public-key derivation are fixed-base multiplications instead of a full
# variable-base scalar multiplication per operation.
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "precomputed-tables"] }
sha2 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
aes = { version = "0.9", default-features = false }
cbc = { version = "0.2", default-features = false, features = ["alloc", "block-padding"] }

zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1"

[[bench]]
name = "primitives"
harness = false

[[bench]]
name = "ratchets"
harness = false
